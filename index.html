<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Interativa</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <h1>Calculadora</h1>
    <!-- Os controles inicias começam desabilitados, o usuário precisa ligar a calculadora p/ usar. -->
    <div id="calculadora-corpo">
      <input type="number" id="num1" placeholder="Nº 1" disabled> <!-- Campo para o primeiro número, inicialmente desabilitado -->

      <select id="operador" disabled> <!-- Campo para selecionar o operador, inicialmente desabilitado -->
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">x</option>
        <option value="/">/</option>
      </select>

      <input type="number" id="num2" placeholder="Nº 2" disabled> <!-- Campo para o segundo número, inicialmente desabilitado -->

      <button id="btnCalcular" onclick="calcular()" disabled>Calcular</button> <!-- Botão para realizar o cálculo, inicialmente desabilitado -->
      <button id="btnPower" type="button" onclick="ligarDesligar()">Ligar</button> <!-- Botão para ligar/desligar a calculadora -->
    </div>

    <p id="statusPower" class="status-power">Estado: Desligada</p> <!-- Indicador de estado da calculadora (Ligada/Desligada) -->

    <div class="visor-container">
      <p>Resultado: <span id="visor">0</span></p>
    </div>

    <ul id="historico-lista"></ul> <!-- Lista para exibir o histórico de cálculos -->
  </div>

  <footer>
    <p>&copy; 2026 - IFSP Bauru - Calculadora Interativa.</p>
    <p>By Enzo Bersi e Felipe Lucas.</p>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
