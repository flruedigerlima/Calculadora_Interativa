<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Interativa</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <h1>Calculadora</h1>
    <!-- Os controles inicias começam desabilitados, o usuário precisa ligar a calculadora p/ usar. -->
    <div id="calculadora-corpo">
      <input type="number" id="num1" placeholder="Nº 1" disabled>

      <select id="operador" disabled>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">x</option>
        <option value="/">/</option>
      </select>

      <input type="number" id="num2" placeholder="Nº 2" disabled>

      <button id="btnCalcular" onclick="calcular()" disabled>Calcular</button>
      <button id="btnPower" type="button" onclick="ligarDesligar()">Ligar</button>
    </div>

    <p id="statusPower" class="status-power">Estado: Desligada</p>

    <div class="visor-container">
      <p>Resultado: <span id="visor">0</span></p>
    </div>

    <ul id="historico-lista"></ul>
  </div>
  <script src="./script.js"></script>
</body>

</html>
