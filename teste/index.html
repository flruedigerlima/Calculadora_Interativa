      <button class="numero">6</button>

      <button class="numero">2</button>
      <button class="numero">3</button>
      <button class="operador">+</button>

      <button class="igual">=</button>
      <button class="extra">%</button>
    </div>

    <div class="historico-area">

        </button>

      <p class="contador" id="contadorHistorico">Total de cálculos: 0</p>
    </div>

  <script>
    // ==========================
    // VARIÁVEIS DE TIPOS DIFERENTES
    // string, number, boolean e array
    // ==========================
    let expressao = "";           // string
    let totalCalculos = 0;        // number
    let temaEscuro = true;        // boolean
    let historico = [];           // array

    // ==========================
    // SELEÇÃO DE ELEMENTOS DO DOM
    // ==========================
    const visor = document.getElementById("visor");
    const botoes = document.querySelectorAll(".botoes button");
    const listaHistorico = document.getElementById("listaHistorico");
    const contadorHistorico = document.getElementById("contadorHistorico");
    const limparHistoricoBtn = document.getElementById("limparHistorico");
    const temaInfo = document.getElementById("temaInfo");
    const body = document.body;

    // ==========================
    // FUNÇÃO PARA ATUALIZAR O VISOR
    // ==========================
    function atualizarVisor(texto) {
      visor.value = texto;
    }

    // ==========================
    // FUNÇÃO COM PARÂMETROS E RETORNO
    // Faz o cálculo entre dois números
    // ==========================
    function calcular(num1, operador, num2) {
      let resultado;

      if (operador === "+") {
        resultado = num1 + num2;
      } else if (operador === "-") {
        resultado = num1 - num2;
      } else if (operador === "*") {
        resultado = num1 * num2;
      } else if (operador === "/") {
        if (num2 === 0) {
          return "Erro";
        }
        resultado = num1 / num2;
      } else if (operador === "%") {
        resultado = num1 % num2;
      } else {
        return "Erro";
      }

      return resultado;
    }

    // ==========================
    // FUNÇÃO PARA ADICIONAR ITEM NO HISTÓRICO
    // Inserção dinâmica no DOM
    // ==========================
    function adicionarHistorico(conta) {
      historico.push(conta);
      totalCalculos++;

      const item = document.createElement("li");
      item.textContent = conta;
      listaHistorico.appendChild(item);

      contadorHistorico.textContent = "Total de cálculos: " + totalCalculos;
    }

    // ==========================
    // FUNÇÃO PARA LIMPAR HISTÓRICO
    // Remoção dinâmica no DOM
    // ==========================
    function limparHistorico() {
      historico = [];
      totalCalculos = 0;
      listaHistorico.innerHTML = "";
      contadorHistorico.textContent = "Total de cálculos: 0";
    }

    // ==========================
    // FUNÇÃO PARA TROCAR O TEMA
    // Manipulação de estilo no DOM
    // ==========================
    function trocarTema() {
      temaEscuro = !temaEscuro;

      if (temaEscuro === true) {
        body.classList.remove("tema-claro");
        temaInfo.textContent = "Tema atual: Escuro";
      } else {
        body.classList.add("tema-claro");
        temaInfo.textContent = "Tema atual: Claro";
      }
    }

    // ==========================
    // FUNÇÃO PARA RESOLVER A EXPRESSÃO
    // Usa conversão de string para number
    // ==========================
    function resolverExpressao() {
      let operadorEncontrado = "";
      let posicaoOperador = -1;

      // Loop para encontrar o operador
      for (let i = 0; i < expressao.length; i++) {
        if (
          expressao[i] === "+" ||
          expressao[i] === "-" ||
          expressao[i] === "*" ||
          expressao[i] === "/" ||
          expressao[i] === "%"
        ) {
          operadorEncontrado = expressao[i];
          posicaoOperador = i;
          break;
        }
      }

      // Condicional de comparação
      if (posicaoOperador === -1) {
        return;
      }

      let parte1 = expressao.substring(0, posicaoOperador);
      let parte2 = expressao.substring(posicaoOperador + 1);

      // Conversão entre tipos de dados
      let numero1 = parseFloat(parte1);
      let numero2 = parseFloat(parte2);

      // Verificação
      if (isNaN(numero1) || isNaN(numero2)) {
        atualizarVisor("Erro");
        expressao = "";
        return;
      }

      const resultado = calcular(numero1, operadorEncontrado, numero2);

      if (resultado === "Erro") {
        atualizarVisor("Erro");
        expressao = "";
      } else {
        let contaCompleta = `${numero1} ${operadorEncontrado} ${numero2} = ${resultado}`;
        adicionarHistorico(contaCompleta);
        expressao = String(resultado); // conversão de number para string
        atualizarVisor(expressao);
      }
    }

    // ==========================
    // LOOP PARA PERCORRER OS BOTÕES
    // ==========================
    for (let i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener("click", function () {
        const valorBotao = botoes[i].textContent;

        if (valorBotao === "C") {
          expressao = "";
          atualizarVisor("");
        } else if (valorBotao === "←") {
          expressao = expressao.slice(0, -1);
          atualizarVisor(expressao);
        } else if (valorBotao === "=") {
          resolverExpressao();
        } else if (valorBotao === "Tema") {
          trocarTema();
        } else {
          // Evita adicionar dois operadores seguidos
          const ultimoCaractere = expressao[expressao.length - 1];

          const ehOperadorAtual =
            valorBotao === "+" ||
            valorBotao === "-" ||
            valorBotao === "*" ||
            valorBotao === "/" ||
            valorBotao === "%";

          const ultimoEhOperador =
            ultimoCaractere === "+" ||
            ultimoCaractere === "-" ||
            ultimoCaractere === "*" ||
            ultimoCaractere === "/" ||
            ultimoCaractere === "%";

          if (ehOperadorAtual && ultimoEhOperador) {
            return;
          }

          expressao += valorBotao;
          atualizarVisor(expressao);
        }
      });
    }

    // Botão de limpar histórico
    limparHistoricoBtn.addEventListener("click", limparHistorico);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interativa</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        
        <div id="calculadora-corpo">
            <input type="number" id="num1" placeholder="Nº 1">
            
            <select id="operador">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">x</option>
                <option value="/">÷</option>
            </select>

            <input type="number" id="num2" placeholder="Nº 2">
            
            <button onclick="calcular()">Calcular</button>
        </div>

        <div class="visor-container">
            <p>Resultado: <span id="visor">0</span></p>
        </div>

        <ul id="historico-lista"></ul>
    </div>
    <script src="./script.js"></script>
</body>
</html>
